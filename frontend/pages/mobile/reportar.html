<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>MoviMed — Reportar | tppmaps</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../static/css/movil.css" />
</head>
<body>
  <a class="desktop-link" href="../../app.html">← Vista comando tppmaps</a>
  <div class="status-bar">
    <span>TPPMAPS</span>
    <span id="clock">13:41</span>
    <span>98%</span>
  </div>
  <a class="back-link" href="inicio.html">&lt; Cancelar</a>
  <h1 class="page-title">REPORTAR ALERTA</h1>
  <main>
    <p class="prompt">¿Qué riesgo vial encontraste?</p>
    <div class="report-grid" id="reportGrid">
      <button type="button" class="report-type" data-type="collision">
        <div class="icon">💥</div>
        <strong>COLISIÓN</strong>
        <span>Accidente vial</span>
      </button>
      <button type="button" class="report-type" data-type="flood">
        <div class="icon">🌊</div>
        <strong>INUNDACIÓN</strong>
        <span>Vía anegada</span>
      </button>
      <button type="button" class="report-type" data-type="obstacle">
        <div class="icon">🚧</div>
        <strong>OBSTÁCULO</strong>
        <span>Objeto en vía</span>
      </button>
      <button type="button" class="report-type" data-type="pothole">
        <div class="icon">⛔</div>
        <strong>HUECO PELIGROSO</strong>
        <span>Daño en vía</span>
      </button>
    </div>
    <button type="button" class="btn-voice" id="btnSubmit" disabled style="opacity:0.5;margin-top:12px">
      ((•)) SELECCIONA UN TIPO
    </button>
    <button type="button" class="btn-voice" id="btnVoice">🎤 Mantén presionado para reportar por voz</button>
  </main>
  <nav class="nav-bottom">
    <a href="inicio.html">📍 Inicio</a>
    <a href="navegar.html">🧭 Navegar</a>
    <a href="reportar.html" class="active">⚠ Reportar</a>
  </nav>
  <script>
    const API = window.TPPMAPS_API || "/api/v1";
    let selected = null;
    document.querySelectorAll(".report-type").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".report-type").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        selected = btn.dataset.type;
        const sub = document.getElementById("btnSubmit");
        sub.disabled = false;
        sub.style.opacity = "1";
        sub.textContent = "ENVIAR REPORTE — " + btn.querySelector("strong").textContent;
      });
    });
    document.getElementById("btnSubmit").addEventListener("click", async () => {
      if (!selected) return;
      try {
        await fetch(`${API}/reports`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: selected, lat: 6.2442, lng: -75.5812 }),
        });
        alert("Reporte enviado correctamente.");
      } catch {
        alert("Demo: reporte «" + selected + "» registrado localmente.");
      }
    });
    setInterval(() => {
      document.getElementById("clock").textContent = new Date().toLocaleTimeString("es-CO", {
        hour: "2-digit",
        minute: "2-digit",
      });
    }, 1000);
  </script>
</body>
</html>
